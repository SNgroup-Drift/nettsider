# K-233: sjekker skjermbildebiblioteket på bilder.hengsel.no mot nettsidene (Code-økta når ikke biblioteket, så dette gjøres her).
#
# - Kjøres for hånd (Actions › Bibliotek-sjekk › Run workflow, velg gren) og på hver pull request.
# - Henter https://bilder.hengsel.no/skjermbilder/v1/manifest.json, sammenlikner med kopien packages/hengsel-tokens/skjermbilder-manifest.json
#   (nye, borte, endrede filer), ber om hver bildeadresse i manifestet (200, image/webp, riktig lengde), bygger alle sidene med det ekte manifestet,
#   kjører bibliotekstesten og lenkesjekken (SKJERMBILDER_NETT=1: hver bibliotekadresse i dist bes om over nettet), tar skjermbildene i claude/k233
#   uten stand-in, og legger manifest-kopien, sjekken, rapporten (antall ekte bilder og plassholdere per side) og skjermbildene som artefakt.
# - Valget «oppdater kopi» (bare for hånd) committer den oppdaterte manifest-kopien til grenen workflowen kjøres på. Merger aldri.
# - N-2 (17.10): kjører også hver morgen kl. 07.15 (Oslo) på main. Da fjernes nøkler fra KJENTE_MANGLER som nå finnes i biblioteket
#   (scripts/rydd-kjente-mangler.mjs), og er bygget og testene grønne, committes manifest-kopien og lista til main – det får Cloudflare til å
#   bygge sidene på nytt med de nye skjermbildene (biblioteket fylles av «Skjermbilder» i hengsel-crm etter hver Visning-utrulling).
#   Er testene røde (et nytt bilde mangler som ikke står i lista), committes ingenting; avviket står i sammendraget.
# - Ingen hemmeligheter: biblioteket er åpent, og committen bruker GITHUB_TOKEN.
name: Bibliotek-sjekk

on:
  workflow_dispatch:
    inputs:
      oppdater_kopi:
        description: "oppdater kopi: commit den oppdaterte manifest-kopien (packages/hengsel-tokens/skjermbilder-manifest.json) til grenen"
        type: boolean
        default: false
  pull_request:
  schedule:
    - cron: "15 5 * * *" # 07.15 Oslo sommertid (06.15 etter 25.10), etter nattens Visning-utrulling og Skjermbilder i hengsel-crm

permissions:
  contents: write

concurrency:
  group: bibliotek-sjekk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sjekk:
    name: Manifest, bilder, bygg og test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Ved pull_request sjekkes PR-grenens hode; ved kjøring for hånd grenen som er valgt
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer avhengigheter
        run: npm ci --no-audit --no-fund

      - name: Installer Chromium (testene og skjermbildene bruker Playwright)
        run: npx playwright install --with-deps chromium

      - name: Hent det ekte manifestet og be om hver bildeadresse
        id: bibliotek
        # Exit 1 ved avvik fra kopien eller bilder som ikke svarer: det skal ikke stoppe byggingen og testene, men vises i sammendraget og i artefaktet
        run: |
          set +e
          node scripts/sjekk-bibliotek.mjs --skriv
          kode=$?
          set -e
          echo "kode=$kode" >> "$GITHUB_OUTPUT"
          if [ "$kode" = "2" ]; then echo "::error::manifest.json nås ikke fra Actions"; exit 2; fi
          if [ "$kode" != "0" ]; then echo "::warning::Bibliotek-sjekken fant avvik, se claude/k233/bibliotek-sjekk.md"; fi

      - name: Vis endringen i manifest-kopien
        run: git --no-pager diff --stat -- packages/hengsel-tokens/skjermbilder-manifest.json

      # N-2: nøkler som nå finnes i biblioteket tas ut av KJENTE_MANGLER før bygg og test (ellers feiler bibliotekstesten punkt 4)
      - name: Rydd KJENTE_MANGLER mot det ekte manifestet
        run: node scripts/rydd-kjente-mangler.mjs

      - name: Bygg alle sidene (med det ekte manifestet)
        run: npm run build

      - name: Bibliotekstesten og lenkesjekken mot ekte adresser
        id: test
        env:
          SKJERMBILDER_NETT: "1"
        run: npm test

      # K-238: skjermbildene først (skriptet fjerner bare egne filer i claude/k233), så rapporten; begge kjøres også når testen feiler
      - name: Skjermbilder uten stand-in
        if: always()
        run: node scripts/skjermbilder-k233.mjs --ekte

      - name: Rapport per side (bilder fra biblioteket, egne bilder og plassholdere)
        if: always()
        run: node scripts/bibliotek-rapport.mjs claude/k233/bibliotek-rapport.md

      - name: Artefakt (manifest-kopi, sjekk, rapport, skjermbilder)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibliotek-sjekk-${{ github.run_number }}
          path: |
            packages/hengsel-tokens/skjermbilder-manifest.json
            claude/k233/bibliotek-sjekk.md
            claude/k233/bibliotek-rapport.md
            claude/k233/LES-MEG.md
            claude/k233/*.webp
          retention-days: 30
          if-no-files-found: warn

      # K-238: sjekken, rapporten og skjermbildenotatet i jobbsammendraget, også når et steg feilet; mangler en fil, står det
      - name: Sammendrag
        if: always()
        env:
          SJEKK_KODE: ${{ steps.bibliotek.outputs.kode }}
          TEST_UTFALL: ${{ steps.test.outcome }}
        run: |
          {
            echo "Bibliotek-sjekken ga exit $SJEKK_KODE (0 = ingen avvik, 1 = avvik eller bilder som ikke svarer, 2 = manifestet nås ikke); npm test: $TEST_UTFALL."
            echo
            for f in claude/k233/bibliotek-sjekk.md claude/k233/bibliotek-rapport.md claude/k233/LES-MEG.md; do
              if [ -s "$f" ]; then cat "$f"; else echo "**$f mangler** (steget som skriver fila stoppet før den ble skrevet; se loggen)."; fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit manifest-kopien og KJENTE_MANGLER («oppdater kopi», eller morgenkjøringen på main når alt er grønt)
        if: (github.event_name == 'workflow_dispatch' && inputs.oppdater_kopi) || (github.event_name == 'schedule' && github.ref_name == 'main' && steps.test.outcome == 'success')
        env:
          GREN: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- packages/hengsel-tokens/skjermbilder-manifest.json scripts/lib/bildedomene.mjs; then
            echo "Kopien og lista er alt lik det ekte manifestet; ingenting å committe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/hengsel-tokens/skjermbilder-manifest.json scripts/lib/bildedomene.mjs
          git commit -m "K-233/N-2: manifest-kopien og KJENTE_MANGLER oppdatert fra bilder.hengsel.no (Bibliotek-sjekk, kjøring ${{ github.run_number }})"
          git push origin "HEAD:refs/heads/$GREN"
