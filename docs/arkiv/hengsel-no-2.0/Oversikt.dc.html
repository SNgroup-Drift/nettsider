<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <style>
    body { margin: 0; background: #E4D4C4; font-family: "Inter", Arial, sans-serif; color: #31261D; }
    a { color: #5074A9; } a:hover { color: #31261D; }
  </style>
</helmet>
<section style="padding:48px; display:flex; flex-direction:column; gap:24px">
  <div style="display:flex; flex-direction:column; gap:8px">
    <h1 style="margin:0; font:600 22px/1.2 Inter, sans-serif">hengsel.no 2.0 · PC 1440 og telefon 390 · lys og mørk</h1>
    <div style="display:flex; flex-wrap:wrap; gap:8px">
      <sc-for list="{{ sider }}" as="s" hint-placeholder-count="8">
        <button type="button" onClick="{{ s.go }}" style="{{ s.style }}">{{ s.t }}</button>
      </sc-for>
    </div>
  </div>
  <div style="display:flex; gap:32px; align-items:flex-start">
    <sc-for list="{{ visninger }}" as="v" hint-placeholder-count="4">
      <div style="display:flex; flex-direction:column; gap:8px">
        <span style="font-size:13px; color:#5E564C">{{ v.label }}</span>
        <iframe src="{{ v.src }}" title="{{ v.label }}" style="{{ v.style }}"></iframe>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { i: 0 };
  renderVals() {
    const S = [['Forside', 'Forside.dc.html'], ['/crm', 'CRM.dc.html'], ['/ute', 'Ute.dc.html'], ['/kundeportal', 'Kundeportal.dc.html'], ['/slik-virker-det', 'Slik-virker-det.dc.html'], ['/dokumenter', 'Dokumenter.dc.html'], ['/integrasjoner', 'Integrasjoner.dc.html'], ['/priser-og-demo', 'Priser-og-demo.dc.html']];
    const f = S[this.state.i][1];
    return {
      sider: S.map(([t], n) => ({ t, go: () => this.setState({ i: n }), style: { minHeight: 36, padding: '0 14px', borderRadius: 999, border: '1px solid #31261D', background: n === this.state.i ? '#31261D' : 'transparent', color: n === this.state.i ? '#FBF9F6' : '#31261D', font: '400 14px Inter, sans-serif', cursor: 'pointer' } })),
      visninger: [['PC 1440 · lys', 1440, 'lys'], ['PC 1440 · mørk', 1440, 'mork'], ['Telefon 390 · lys', 390, 'lys'], ['Telefon 390 · mørk', 390, 'mork']].map(([label, w, t]) => ({
        label, src: f + '?tema=' + t,
        style: { width: w, height: w > 400 ? 2400 : 2400, border: '1px solid #C3B5A7', borderRadius: 10, background: '#FBF9F6', display: 'block' },
      })),
    };
  }
}
</script>
</body>
</html>
