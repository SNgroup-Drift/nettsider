<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ outer }}" style="width:100%; min-width:0">
  <sc-if value="{{ isDisplay }}" hint-placeholder-val="{{ false }}">
    <div style="position:relative; width:100%; aspect-ratio:2160/1664">
      <div ref="{{ screenRef }}" style="position:absolute; left:2.59%; top:3.37%; width:94.81%; height:69.23%; overflow:hidden; background:var(--surface-app)">
        <sc-if value="{{ hasSrc }}" hint-placeholder-val="{{ false }}">
          <img src="{{ src }}" alt="{{ alt }}" style="display:block; width:100%; height:100%; object-fit:cover; object-position:top left">
        </sc-if>
        <sc-if value="{{ hasKids }}" hint-placeholder-val="{{ false }}">
          <div style="{{ scaler }}">{{ children }}</div>
        </sc-if>
      </div>
      <img src="hengsel.no/img/ramme-studio-display.webp" alt="" aria-hidden="true" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none">
    </div>
  </sc-if>
  <sc-if value="{{ isIpad }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%; aspect-ratio:1212/852; box-sizing:border-box; background:#1B1713; border-radius:3.2% / 4.4%; padding:1.32%; box-shadow:0 0 0 1px var(--line), var(--shadow)">
      <div ref="{{ screenRef }}" style="position:relative; width:100%; height:100%; border-radius:1.9% / 2.7%; overflow:hidden; background:var(--surface-app)">
        <sc-if value="{{ hasSrc }}" hint-placeholder-val="{{ false }}">
          <img src="{{ src }}" alt="{{ alt }}" style="display:block; width:100%; height:100%; object-fit:cover; object-position:top left">
        </sc-if>
        <sc-if value="{{ hasKids }}" hint-placeholder-val="{{ false }}">
          <div style="{{ scaler }}">{{ children }}</div>
        </sc-if>
        <sc-if value="{{ visLogo }}" hint-placeholder-val="{{ false }}"><div style="{{ logoIpad }}"><span data-din-logo="true" style="display:flex; flex-direction:column; gap:3px; align-items:flex-start"><span style="height:30px; padding:0 14px; border:1.5px dashed {{ logoLine }}; border-radius:6px; display:flex; align-items:center; font-size:13px; font-weight:600; letter-spacing:.02em; color:{{ logoInk }}; box-sizing:border-box">Din logo</span></span></div></sc-if>
        <div aria-hidden="true" style="{{ sbIpad }}">
          <span style="position:absolute; left:22px; top:0; height:24px; display:flex; align-items:center; gap:8px; font-family:-apple-system, 'SF Pro Text', 'SF Pro', Inter, Arial, sans-serif; font-weight:600; font-size:14px">9:41<span>man. 12. okt.</span></span>
          <span style="position:absolute; right:22px; top:0; height:24px; display:flex; align-items:center; gap:6px"><svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor" aria-hidden="true"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5L16 3.6C13.9 1.6 11.3.5 8.5.5S3.1 1.6 1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3z"></path><path d="M8.5 5.6c1.5 0 2.9.6 3.9 1.5l1.2-1.2C12.3 4.6 10.5 3.8 8.5 3.8S4.7 4.6 3.4 5.9l1.2 1.2c1-.9 2.4-1.5 3.9-1.5z"></path><path d="M8.5 8.6c.7 0 1.3.3 1.8.7l-1.8 2.2-1.8-2.2c.5-.4 1.1-.7 1.8-.7z"></path></svg><svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="currentColor" stroke-opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2.2" fill="currentColor"></rect><rect x="24.6" y="4.4" width="1.8" height="4.2" rx=".9" fill="currentColor" fill-opacity=".45"></rect></svg></span>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ true }}">
    <div style="width:100%; aspect-ratio:426/898; box-sizing:border-box; background:#1B1713; border-radius:15.5% / 7.3%; padding:2.8%; box-shadow:0 0 0 1px var(--line), var(--shadow)">
      <div ref="{{ screenRef }}" style="position:relative; width:100%; height:100%; border-radius:13.7% / 6.3%; overflow:hidden; background:var(--surface-app)">
        <sc-if value="{{ hasSrc }}" hint-placeholder-val="{{ false }}">
          <img src="{{ src }}" alt="{{ alt }}" style="display:block; width:100%; height:100%; object-fit:cover; object-position:top center">
        </sc-if>
        <sc-if value="{{ hasKids }}" hint-placeholder-val="{{ false }}">
          <div style="{{ scaler }}">{{ children }}</div>
        </sc-if>
        <sc-if value="{{ visLogo }}" hint-placeholder-val="{{ false }}"><div style="{{ logoTlf }}"><span data-din-logo="true" style="display:flex; flex-direction:column; gap:3px; align-items:flex-start"><span style="height:30px; padding:0 14px; border:1.5px dashed {{ logoLine }}; border-radius:6px; display:flex; align-items:center; font-size:13px; font-weight:600; letter-spacing:.02em; color:{{ logoInk }}; box-sizing:border-box">Din logo</span></span></div></sc-if>
        <div aria-hidden="true" style="{{ sbTlf }}">
          <span style="position:absolute; left:0; top:0; width:136px; height:54px; display:flex; align-items:center; justify-content:center; padding-top:5px; box-sizing:border-box; font-family:-apple-system, 'SF Pro Text', 'SF Pro', Inter, Arial, sans-serif; font-weight:600; font-size:17px; letter-spacing:-.01em">9:41</span>
          <span style="position:absolute; left:138.5px; top:11px; width:125px; height:37px; border-radius:20px; background:#000000"></span>
          <span style="position:absolute; right:0; top:0; width:136px; height:54px; display:flex; align-items:center; justify-content:center; gap:6px; padding-top:5px; box-sizing:border-box"><svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3.2" height="4" rx="1"></rect><rect x="5.2" y="5.5" width="3.2" height="6.5" rx="1"></rect><rect x="10.4" y="3" width="3.2" height="9" rx="1"></rect><rect x="15.6" y="0" width="3.2" height="12" rx="1"></rect></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor" aria-hidden="true"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5L16 3.6C13.9 1.6 11.3.5 8.5.5S3.1 1.6 1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3z"></path><path d="M8.5 5.6c1.5 0 2.9.6 3.9 1.5l1.2-1.2C12.3 4.6 10.5 3.8 8.5 3.8S4.7 4.6 3.4 5.9l1.2 1.2c1-.9 2.4-1.5 3.9-1.5z"></path><path d="M8.5 8.6c.7 0 1.3.3 1.8.7l-1.8 2.2-1.8-2.2c.5-.4 1.1-.7 1.8-.7z"></path></svg><svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="currentColor" stroke-opacity=".4"></rect><rect x="2" y="2" width="20" height="9" rx="2.2" fill="currentColor"></rect><rect x="24.6" y="4.4" width="1.8" height="4.2" rx=".9" fill="currentColor" fill-opacity=".45"></rect></svg></span>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;display&quot;,&quot;ipad&quot;,&quot;iphone&quot;],&quot;default&quot;:&quot;iphone&quot;,&quot;tsType&quot;:&quot;'display'|'ipad'|'iphone'&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hengsel.no/ios/idag-lys.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;srcDark&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;statusFarge&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;hvit&quot;,&quot;svart&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'hvit'|'svart'&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;h&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { sw: 0 };
  outer = React.createRef();
  screenRef = React.createRef();
  componentDidMount() {
    const m = () => { const el = this.screenRef.current; if (!el) return; const w = el.clientWidth; if (w && Math.abs(w - this.state.sw) > .5) this.setState({ sw: w }); };
    this.ro = new ResizeObserver(m); if (this.outer.current) this.ro.observe(this.outer.current); m();
    this.t = setTimeout(m, 50);
  }
  componentDidUpdate() { const el = this.screenRef.current; if (el && Math.abs(el.clientWidth - this.state.sw) > .5) this.setState({ sw: el.clientWidth }); }
  componentWillUnmount() { this.ro && this.ro.disconnect(); clearTimeout(this.t); }
  renderVals() {
    const t = this.props.type || 'iphone';
    const dark = !!this.props.dark;
    const src = (dark && this.props.srcDark) || this.props.src || '';
    const nat = { display: [1440, 810], ipad: [1180, 820], iphone: [402, 874] }[t] || [402, 874];
    const W = this.props.w || nat[0], H = this.props.h || nat[1];
    const k = this.state.sw ? this.state.sw / W : 0.0001;
    const kNat = this.state.sw ? this.state.sw / nat[0] : 0.0001;
    const morkInnhold = src ? (dark && !!this.props.srcDark) : dark;
    const sf = this.props.statusFarge || 'auto';
    const farge = sf === 'hvit' ? '#FFFFFF' : sf === 'svart' ? '#000000' : (morkInnhold ? '#FFFFFF' : '#000000');
    const inset = t === 'ipad' && !src ? 24 : 0;
    const sbBase = { position: 'absolute', left: 0, top: 0, width: nat[0], transform: `scale(${kNat})`, transformOrigin: '0 0', color: farge, zIndex: 20, pointerEvents: 'none' };
    return {
      outer: this.outer, screenRef: this.screenRef,
      isDisplay: t === 'display', isIpad: t === 'ipad', isPhone: t === 'iphone',
      src, hasSrc: !!src, hasKids: !src, alt: this.props.alt || '',
      children: this.props.children,
      scaler: { position: 'absolute', left: 0, top: 0, width: W, height: H, transform: `translateY(${inset * kNat}px) scale(${k})`, transformOrigin: '0 0' },
      visLogo: /\/(ipad-)?idag-/.test(src),
      logoInk: morkInnhold ? '#F1E9DE' : '#31261D', logoMuted: morkInnhold ? '#C3B5A7' : '#5E564C', logoLine: morkInnhold ? '#6B5D50' : '#C3B5A7',
      logoTlf: { position: 'absolute', right: 16 * kNat, top: 56 * kNat, transform: `scale(${kNat})`, transformOrigin: '100% 0', zIndex: 15, pointerEvents: 'none' },
      logoIpad: { position: 'absolute', left: 74 * kNat, top: 28 * kNat, transform: `scale(${kNat})`, transformOrigin: '0 0', zIndex: 15, pointerEvents: 'none' },
      sbTlf: { ...sbBase, height: 54 }, sbIpad: { ...sbBase, height: 24 },
    };
  }
}
</script>
</body>
</html>
