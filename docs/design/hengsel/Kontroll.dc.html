<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>body { margin: 0; background: #FBF9F6; font-family: Inter, Arial, sans-serif; color: #31261D; } a { color: #5074A9; } a:hover { color: #31261D; }</style>
</helmet>
<div style="padding:24px; display:flex; flex-direction:column; gap:10px; font-size:12px; line-height:1.4">
  <b style="font-size:16px">Kontroll · {{ status }}</b>
  <sc-for list="{{ rader }}" as="r" hint-placeholder-count="8">
    <div style="{{ r.style }}"><b>{{ r.side }}</b> <span>{{ r.tekst }}</span></div>
  </sc-for>
  <div style="position:absolute; left:-20000px; top:0; display:flex; gap:20px">
    <sc-for list="{{ rammer }}" as="f" hint-placeholder-count="4">
      <iframe ref="{{ f.ref }}" src="{{ f.src }}" style="{{ f.style }}"></iframe>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const ALLE = ['Forside', 'CRM', 'Ute', 'Kundeportal', 'Slik-virker-det', 'Dokumenter', 'Integrasjoner', 'Priser-og-demo'];
const qs = new URLSearchParams(location.search);
const SIDER = qs.get('side') ? [qs.get('side')] : ALLE;
const SETUP = qs.get('pc') ? "[...document.querySelectorAll('button[role=radio]')].find(b=>b.textContent.trim()==='PC')?.click()" : '';
const MODI = [[1440, 'lys'], [1440, 'mork'], [390, 'lys'], [390, 'mork']];
const ENG = /\b(backup|leads?|login|sign in|submit|download|settings|dashboard|request|learn more|read more|click|the|and|with|your)\b/i;
const parse = s => { const m = s.match(/rgba?\(([^)]+)\)/); if (!m) return null; const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p[3] === undefined ? 1 : p[3]]; };
const lum = c => { const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }; return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
const blend = (top, bot) => { const a = top[3]; return [top[0] * a + bot[0] * (1 - a), top[1] * a + bot[1] * (1 - a), top[2] * a + bot[2] * (1 - a), 1]; };
function analyse(doc, W) {
  const win = doc.defaultView; const out = { over: [], kontrast: [], bilder: [], eng: [] };
  if (doc.documentElement.scrollWidth > W + 1) {
    for (const el of doc.body.querySelectorAll('*')) { const r = el.getBoundingClientRect(); if (r.right > W + 2 && r.width > 0 && r.width < W * 3) { let clip = false; for (let a = el.parentElement; a && a !== doc.body; a = a.parentElement) { const o = win.getComputedStyle(a).overflowX; if (o === 'hidden' || o === 'clip' || o === 'auto') { clip = true; break; } } if (!clip) out.over.push((el.tagName + ' ' + (el.textContent || '').trim().slice(0, 40)) + ' r=' + Math.round(r.right)); } }
    out.over = out.over.slice(0, 4); if (!out.over.length) out.over.push('scrollWidth ' + doc.documentElement.scrollWidth);
  }
  for (const im of doc.images) if (im.complete && im.naturalWidth === 0 && im.getAttribute('src')) out.bilder.push(im.getAttribute('src'));
  for (const el of doc.body.querySelectorAll('*')) {
    const own = [...el.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim()).map(n => n.textContent.trim()).join(' ');
    if (!own) continue;
    const cs = win.getComputedStyle(el); const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1 || cs.visibility === 'hidden' || cs.display === 'none') continue;
    if (el.closest('iframe,svg,[aria-hidden="true"],[data-over-bilde]')) continue;
    if (ENG.test(own) && !/Apple Pencil|iPad|iPhone|App Store|Google Play|TestFlight|PowerOffice|Tradeplace|Penneo|BankID|CET/.test(own)) out.eng.push(own.slice(0, 50));
    let op = 1, bg = null, layers = [];
    for (let a = el; a; a = a.parentElement) { const s = win.getComputedStyle(a); op *= parseFloat(s.opacity); const b = parse(s.backgroundColor); if (b && b[3] > 0) { layers.push(b); if (b[3] >= .99) break; } }
    let base = [251, 249, 246, 1]; if (!layers.length || layers[layers.length - 1][3] < .99) { const hb = parse(win.getComputedStyle(doc.documentElement).backgroundColor); if (hb && hb[3] > 0) base = hb; }
    bg = layers.reverse().reduce((acc, l) => blend(l, acc), base);
    let fg = parse(cs.color); if (!fg) continue; fg = blend([fg[0], fg[1], fg[2], fg[3] * op], bg);
    const L1 = lum(fg), L2 = lum(bg); const ratio = (Math.max(L1, L2) + .05) / (Math.min(L1, L2) + .05);
    const size = parseFloat(cs.fontSize), bold = parseInt(cs.fontWeight) >= 600;
    const need = size >= 24 || (size >= 18.6 && bold) ? 3 : 4.5;
    if (ratio < need - .05) out.kontrast.push(`«${own.slice(0, 34)}» ${ratio.toFixed(2)} [${el.tagName}.${el.className} fg ${cs.color} bg ${bg.map(Math.round).join(',')}]${op < 1 ? ' (op ' + op.toFixed(2) + ')' : ''}`);
  }
  out.kontrast = [...new Set(out.kontrast)];
  out.hoyde = doc.documentElement.scrollHeight;
  return out;
}
class Component extends DCLogic {
  state = { i: 0, rader: [], ferdig: false };
  refs4 = MODI.map(() => React.createRef());
  componentDidMount() { this.go(); }
  async go() {
    for (let i = 0; i < SIDER.length; i++) {
      this.setState({ i });
      await new Promise(r => setTimeout(r, 5500));
      if (SETUP) { this.refs4.forEach(rf => { try { rf.current.contentWindow.eval(SETUP); } catch (e) {} }); await new Promise(r => setTimeout(r, 3500)); }
      const rad = [];
      MODI.forEach(([w, t], k) => {
        const f = this.refs4[k].current; let res;
        try { res = analyse(f.contentDocument, w); } catch (e) { res = { feil: String(e) }; }
        const deler = [];
        if (res.feil) deler.push('FEIL ' + res.feil);
        else {
          if (res.over.length) deler.push('OVERFLYT: ' + res.over.join(' | '));
          if (res.bilder.length) deler.push('BILDE MANGLER: ' + res.bilder.join(', '));
          if (res.kontrast.length) deler.push('KONTRAST (' + res.kontrast.length + '): ' + res.kontrast.slice(0, 8).join(' | '));
          if (res.eng.length) deler.push('ENGELSK?: ' + res.eng.slice(0, 5).join(' | '));
        }
        rad.push({ side: `${SIDER[i]} · ${w} ${t} · ${res.hoyde || 0}px:`, tekst: deler.length ? deler.join('  ·  ') : 'OK', ok: !deler.length });
      });
      this.setState(s => ({ rader: s.rader.concat(rad) }));
    }
    this.setState({ ferdig: true });
  }
  renderVals() {
    const side = SIDER[this.state.i];
    return {
      status: this.state.ferdig ? 'ferdig' : `sjekker ${side} (${this.state.i + 1}/8)`,
      rader: this.state.rader.map(r => ({ ...r, style: { padding: '4px 8px', borderRadius: 6, background: r.ok ? '#E4EEE6' : '#F5EAD3' } })),
      rammer: MODI.map(([w, t], k) => ({ ref: this.refs4[k], src: `${side}.dc.html?tema=${t}`, style: { width: w, height: 3000, border: 0 } })),
    };
  }
}
</script>
</body>
</html>
